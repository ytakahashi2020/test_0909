<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devnet ウォレット</title>
<style>
  :root {
    --paper: #1a1f2b;
    --ink: #e8ebf2;
    --dim: #8b93a7;
    --line: #2d3446;
    --sol: #9c7cf5;
    --usdc: #4fb0e6;
    --ok: #6fcf97;
    --ng: #f28b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .net {
    color: var(--dim);
    font-size: 13px;
    margin: 0 0 28px;
  }
  section {
    border-top: 1px solid var(--line);
    padding: 20px 0;
  }
  .addr {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 13px;
    word-break: break-all;
    color: var(--dim);
    margin: 8px 0 12px;
    min-height: 22px;
  }
  .balances {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .bal { padding: 14px 16px; border-radius: 10px; background: #222839; }
  .bal .label { font-size: 13px; color: var(--dim); }
  .bal .num {
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .bal.sol .num { color: var(--sol); }
  .bal.usdc .num { color: var(--usdc); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #262d3f;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, opacity .12s;
  }
  button:hover:not(:disabled) { background: #303851; }
  button:focus-visible { outline: 2px solid var(--sol); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: wait; }
  button.primary { background: var(--sol); border-color: var(--sol); color: #14101f; }
  button.primary:hover:not(:disabled) { background: #ad92ff; }
  #log {
    list-style: none;
    margin: 0;
    padding: 0;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 12.5px;
    color: var(--dim);
    max-height: 220px;
    overflow-y: auto;
  }
  #log li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  #log li.ok { color: var(--ok); }
  #log li.ng { color: var(--ng); }
  #log li time { opacity: .6; margin-right: 8px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Devnet ウォレット</h1>
  <p class="net">Solana Devnet・api.devnet.solana.com</p>

  <section>
    <div class="row">
      <button id="btnConnect" class="primary">Phantom を接続</button>
      <button id="btnCopy" class="hidden">アドレスをコピー</button>
    </div>
    <div class="addr" id="addr">未接続</div>
  </section>

  <section>
    <div class="balances">
      <div class="bal sol"><div class="label">SOL</div><div class="num" id="balSol">–</div></div>
      <div class="bal usdc"><div class="label">USDC</div><div class="num" id="balUsdc">–</div></div>
    </div>
    <div class="row">
      <button id="btnRefresh" disabled>残高を更新</button>
      <button id="btnSol" disabled>SOL をもらう</button>
      <button id="btnUsdc" disabled>USDC をもらう</button>
    </div>
  </section>

  <section>
    <ul id="log"></ul>
  </section>
</main>

<script src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
<script>
(() => {
  const RPC = "https://api.devnet.solana.com";
  const USDC_MINT = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU";
  const USDC_DECIMALS = 6;

  const $ = id => document.getElementById(id);
  const ui = {
    connect: $("btnConnect"), copy: $("btnCopy"), refresh: $("btnRefresh"),
    sol: $("btnSol"), usdc: $("btnUsdc"),
    addr: $("addr"), balSol: $("balSol"), balUsdc: $("balUsdc"), log: $("log")
  };

  let connection = null;
  let pubkey = null;

  function log(msg, kind) {
    const li = document.createElement("li");
    if (kind) li.className = kind;
    const t = document.createElement("time");
    t.textContent = new Date().toLocaleTimeString("ja-JP", { hour12: false });
    li.appendChild(t);
    li.appendChild(document.createTextNode(msg));
    ui.log.prepend(li);
  }

  async function busy(btn, label, fn) {
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = label;
    try { await fn(); }
    catch (e) { log("エラー: " + (e && e.message ? e.message : String(e)), "ng"); }
    finally { btn.textContent = orig; btn.disabled = false; }
  }

  function requireWallet() {
    if (!pubkey) throw new Error("先に Phantom を接続してください");
  }

  async function copyAddress() {
    requireWallet();
    await navigator.clipboard.writeText(pubkey.toBase58());
    log("アドレスをコピーしました", "ok");
  }

  function fmt(n, digits) {
    return n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: digits });
  }

  async function fetchBalances() {
    requireWallet();
    const lamports = await connection.getBalance(pubkey);
    const sol = lamports / solanaWeb3.LAMPORTS_PER_SOL;
    ui.balSol.textContent = fmt(sol, 9);

    const res = await connection.getParsedTokenAccountsByOwner(pubkey, {
      mint: new solanaWeb3.PublicKey(USDC_MINT)
    });
    let raw = 0;
    for (const { account } of res.value) {
      raw += Number(account.data.parsed.info.tokenAmount.amount);
    }
    const usdc = raw / 10 ** USDC_DECIMALS;
    ui.balUsdc.textContent = fmt(usdc, USDC_DECIMALS);
    log(`残高: ${fmt(sol, 9)} SOL / ${fmt(usdc, USDC_DECIMALS)} USDC`, "ok");
  }

  async function connect() {
    const provider = window.phantom && window.phantom.solana;
    if (!provider || !provider.isPhantom) {
      throw new Error("Phantom が見つかりません。拡張機能を入れてから再読み込みしてください");
    }
    const resp = await provider.connect();
    pubkey = new solanaWeb3.PublicKey(resp.publicKey.toString());
    connection = new solanaWeb3.Connection(RPC, "confirmed");
    ui.addr.textContent = pubkey.toBase58();
    ui.copy.classList.remove("hidden");
    ui.connect.textContent = "接続済み";
    [ui.refresh, ui.sol, ui.usdc].forEach(b => b.disabled = false);
    log("Phantom を接続しました: " + pubkey.toBase58(), "ok");
    await fetchBalances();
  }

  async function faucet(url, name) {
    await copyAddress();
    window.open(url, "_blank", "noopener");
    log(`${name} の蛇口を新しいタブで開きました。貼り付けて請求してください`);
  }

  ui.connect.addEventListener("click", () =>
    busy(ui.connect, "接続中...", async () => {
      if (pubkey) { log("すでに接続しています"); return; }
      await connect();
    }).then(() => { if (pubkey) ui.connect.textContent = "接続済み"; })
  );
  ui.copy.addEventListener("click", () => busy(ui.copy, "コピー中...", copyAddress));
  ui.refresh.addEventListener("click", () => busy(ui.refresh, "更新中...", fetchBalances));
  ui.sol.addEventListener("click", () =>
    busy(ui.sol, "処理中...", () => faucet("https://faucet.solana.com/", "SOL")));
  ui.usdc.addEventListener("click", () =>
    busy(ui.usdc, "処理中...", () => faucet("https://faucet.circle.com/", "USDC")));

  const provider = window.phantom && window.phantom.solana;
  if (provider) {
    provider.on("disconnect", () => {
      pubkey = null;
      ui.addr.textContent = "未接続";
      ui.copy.classList.add("hidden");
      ui.connect.textContent = "Phantom を接続";
      ui.balSol.textContent = "–";
      ui.balUsdc.textContent = "–";
      [ui.refresh, ui.sol, ui.usdc].forEach(b => b.disabled = true);
      log("Phantom との接続が切れました");
    });
  }

  log("ページを読み込みました。Phantom を接続してください");
})();
</script>
</body>
</html>
